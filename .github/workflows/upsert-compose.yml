name: Komodo Compose stack upsert

on:
  workflow_call:
    inputs:
      compose_path:
        required: true
        type: string
      action:
        required: true
        type: string
    secrets:
      KOMODO_API_KEY:
        required: true
      KOMODO_API_SECRET:
        required: true
      KOMODO_SERVER:
        required: true

jobs:
  komodo:
    runs-on: self-hosted
    concurrency:
      group: komodo-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: blavogiez-org/komodo-upsert
          path: action-repo
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: action-repo/package-lock.json

      - name: Run main
        working-directory: action-repo
        run: make run
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_SERVER: ${{ secrets.KOMODO_SERVER }}
          KOMODO_ACTION: ${{ inputs.action }}
          CALLER_REPO: ${{ github.repository }}
          COMPOSE_PATH: ${{ inputs.compose_path }}
          HEAD_COMMIT: ${{ github.sha }}
